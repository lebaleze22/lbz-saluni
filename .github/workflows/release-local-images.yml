name: Release local SALUNI images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish (for example v0.1.0-rc.1)"
        required: true
        default: "edge"

env:
  REGISTRY: ghcr.io
  IMAGE_ROOT: lebaleze22/lbz-saluni

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve and validate image version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            value="$GITHUB_REF_NAME"
          else
            value="$REQUESTED_VERSION"
          fi
          if [[ ! "$value" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid image version: $value" >&2
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  publish:
    needs: [prepare, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: core-api
            dockerfile: Dockerfile
            target: runner
          - image: tooling
            dockerfile: Dockerfile
            target: builder
          - image: postgres
            dockerfile: docker/release/postgres.Dockerfile
            target: ""
          - image: nginx
            dockerfile: docker/release/nginx.Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ROOT }}/${{ matrix.image }}:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  package:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the macOS installation bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          printf '%s\n' "$VERSION" > SALUNI_VERSION
          archive="saluni-client-${VERSION}.tar.gz"
          tar -czf "$archive" \
            SALUNI_VERSION \
            docker-compose.client.yml \
            .env.client.example \
            scripts/client-install \
            docs/guides/installation-locale-macos.md
          sha256sum "$archive" > "${archive}.sha256"
      - name: Upload the installation bundle
        uses: actions/upload-artifact@v4
        with:
          name: saluni-client-${{ needs.prepare.outputs.version }}
          path: |
            saluni-client-${{ needs.prepare.outputs.version }}.tar.gz
            saluni-client-${{ needs.prepare.outputs.version }}.tar.gz.sha256
      - name: Attach bundle to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            saluni-client-${{ needs.prepare.outputs.version }}.tar.gz
            saluni-client-${{ needs.prepare.outputs.version }}.tar.gz.sha256
