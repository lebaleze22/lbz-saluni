# Reverse proxy — LBZ.
#
# Le trafic applicatif va vers core-api. Le service communique avec nginx par son nom
# de conteneur, résolu via le
# DNS interne du réseau Docker "lbz-internal" (cf. docker-compose.yml) — pas d'IP en dur.

# Upgrade -> "upgrade" seulement sur une requête de changement de protocole
# (websocket) ; "close" sinon, pour ne pas casser le keep-alive des requêtes normales.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream core_api {
    server core-api:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://core_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websockets / connexions persistantes (HMR en dev, futur usage temps réel).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
