# Reverse proxy — stack locale LBZ (docker-compose.local.yml).
#
# Distinct de nginx/default.conf (VPS, docker-compose.yml) : ce fichier route en plus
# /auth/v1/* vers gotrue — rôle que Kong joue dans le bundle Supabase complet, sans
# l'ajouter (voir docs/architecture/017-stack-locale-caprice.md). default.conf n'est pas
# modifié.
#
# gotrue n'a pas lui-même de préfixe /auth/v1 dans ses routes (ex. /token, /user,
# /admin/users) — c'est Kong qui ajoute ce préfixe sur Supabase Cloud/self-hosted
# complet. Le `rewrite` ci-dessous reproduit ce comportement : supabase-js appelle
# toujours ${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/..., inchangé qu'on parle à Supabase
# Cloud ou à ce gotrue local.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream core_api {
    server core-api:3000;
}

upstream gotrue_local {
    server gotrue:9999;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Les cookies sont partagés par nom d'hôte, pas par port. Sur localhost, les
    # sessions de plusieurs applications de développement peuvent donc se retrouver
    # dans le même en-tête Cookie. La limite nginx par défaut (8K par grand buffer)
    # rejetait alors la navigation juste après une authentification pourtant réussie.
    # Cette tolérance est volontairement limitée à la stack locale ; le proxy VPS
    # nginx/default.conf conserve ses limites de production.
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;

    location /auth/v1/ {
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass http://gotrue_local;
        proxy_http_version 1.1;

        # $http_host conserve le port public (:54321). Next.js compare Host/
        # X-Forwarded-Host à Origin pour sécuriser les Server Actions.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://core_api;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websockets / connexions persistantes (HMR en dev, futur usage temps réel).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
