<style>
#erd2 svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd2 svg.erDiagram .row-rect-odd path,
#erd2 svg.erDiagram .row-rect-odd rect,
#erd2 svg.erDiagram .row-rect-even path,
#erd2 svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd2"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd2-svg', `erDiagram
  TENANTS ||--o{ USERS : has
  TENANTS ||--o{ JOB_TITLES : defines
  TENANTS ||--o{ STAFF : employs
  TENANTS ||--o{ CLIENTS : has
  TENANTS ||--o{ SERVICES : offers
  TENANTS ||--o{ APPOINTMENTS : schedules
  JOB_TITLES ||--o{ STAFF : labels
  USERS |o--o| STAFF : "compte lié si systemRole != none"
  STAFF ||--o{ APPOINTMENTS : performs
  CLIENTS ||--o{ APPOINTMENTS : books
  APPOINTMENTS ||--o{ APPOINTMENT_SERVICES : includes
  SERVICES ||--o{ APPOINTMENT_SERVICES : used_in
  APPOINTMENTS ||--o{ PAYMENTS : paid_via

  TENANTS {
    uuid id PK
    string name
    boolean isDeleted
    boolean active
  }
  USERS {
    uuid id PK
    uuid tenant_id FK
    string email
    enum role "owner uniquement"
    boolean isDeleted
  }
  JOB_TITLES {
    uuid id PK
    uuid tenant_id FK
    string name "libre, par salon"
    boolean isDeleted
    boolean active
  }
  STAFF {
    uuid id PK
    uuid tenant_id FK
    uuid job_title_id FK
    uuid user_id FK "nullable"
    string name
    enum systemRole "none director manager"
    enum payType "fixed_salary commission"
    int fixedSalary "nullable"
    decimal commissionRate "nullable"
    boolean isDeleted
    boolean active
  }
  CLIENTS {
    uuid id PK
    uuid tenant_id FK
    string name
    string phone "nullable"
    boolean isDeleted
  }
  APPOINTMENTS {
    uuid id PK
    uuid tenant_id FK
    uuid client_id FK
    uuid staff_id FK
    uuid created_by FK
    boolean isDeleted
  }`);
document.getElementById('erd2').innerHTML = svg;

document.querySelectorAll('#erd2 svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd2 svg.erDiagram .row-rect-odd path, #erd2 svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
