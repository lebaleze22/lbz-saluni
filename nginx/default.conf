# Reverse proxy — LBZ.
#
# Pour l'instant, tout le trafic va vers core-api. Le bloc /webhooks/whatsapp ci-dessous
# est prêt mais commenté : whatsapp-agent (Étape 6) n'existe pas encore (voir
# docker-compose.yml et docs/architecture/011-auth-inter-services.md). Le décommenter
# suffira le moment venu — pas besoin de reconfigurer nginx à ce moment-là.
#
# Les deux services communiquent avec nginx par leur nom de conteneur, résolu via le
# DNS interne du réseau Docker "lbz-internal" (cf. docker-compose.yml) — pas d'IP en dur.

# Upgrade -> "upgrade" seulement sur une requête de changement de protocole
# (websocket) ; "close" sinon, pour ne pas casser le keep-alive des requêtes normales.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream core_api {
    server core-api:3000;
}

# upstream whatsapp_agent {
#     server whatsapp-agent:3001;
# }

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # --- Étape 6 (whatsapp-agent) — à décommenter à sa création ------------------
    # location /webhooks/whatsapp {
    #     proxy_pass http://whatsapp_agent;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    # -------------------------------------------------------------------------------

    location / {
        proxy_pass http://core_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websockets / connexions persistantes (HMR en dev, futur usage temps réel).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
